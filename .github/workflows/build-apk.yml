name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build tools and platform
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT="$SDK_ROOT/build-tools/36.0.0"
          SDK_JAR="$SDK_ROOT/platforms/android-36/android.jar"
          OUT="$P/build"
          VCODE=$(grep '^versionCode=' app.properties | cut -d= -f2 || echo 1)
          VNAME=$(grep '^versionName=' app.properties | cut -d= -f2 || echo 1.0)
          MINSDK=$(grep '^minSdk=' app.properties | cut -d= -f2 || echo 24)
          rm -rf "$OUT"; mkdir -p "$OUT/gen" "$OUT/classes" "$OUT/dex"

          echo "1/5 Resources"
          RES=()
          if [ -d "$P/res" ] && [ -n "$(ls -A "$P/res")" ]; then
            "$BT/aapt2" compile --dir "$P/res" -o "$OUT/res.zip"
            RES=("$OUT/res.zip")
          fi
          ASSETS=()
          [ -d "$P/assets" ] && ASSETS=(-A "$P/assets")
          "$BT/aapt2" link -I "$SDK_JAR" --manifest "$P/AndroidManifest.xml" \
            --min-sdk-version "$MINSDK" --target-sdk-version 36 \
            --version-code "$VCODE" --version-name "$VNAME" \
            "${ASSETS[@]}" --java "$OUT/gen" -o "$OUT/base.apk" "${RES[@]}"

          echo "2/5 Java"
          javac --release 8 -classpath "$SDK_JAR" -Xlint:-options -encoding UTF-8 -nowarn \
            -d "$OUT/classes" $(find "$P/java" "$OUT/gen" -name '*.java')

          echo "3/5 Dex"
          "$BT/d8" --release --min-api "$MINSDK" --lib "$SDK_JAR" --output "$OUT/dex" $(find "$OUT/classes" -name '*.class')

          echo "4/5 Package"
          python3 - "$OUT/base.apk" "$OUT/dex/classes.dex" "$OUT/aligned.apk" <<'EOF'
          import sys, zipfile
          src, dex, dst = sys.argv[1:]
          with zipfile.ZipFile(src) as zin, zipfile.ZipFile(dst, "w") as zout:
              entries = [(i, zin.read(i.filename)) for i in zin.infolist()]
              entries.append((zipfile.ZipInfo("classes.dex"), open(dex, "rb").read()))
              entries[-1][0].compress_type = zipfile.ZIP_DEFLATED
              for info, data in entries:
                  out = zipfile.ZipInfo(info.filename, date_time=info.date_time)
                  out.compress_type = info.compress_type
                  out.external_attr = info.external_attr
                  if out.compress_type == zipfile.ZIP_STORED:
                      start = zout.fp.tell() + 30 + len(out.filename.encode())
                      out.extra = b"\0" * ((-start) % 4)
                  zout.writestr(out, data)
          EOF

          echo "5/5 Sign"
          KEYDIR="$RUNNER_TEMP/keys"
          mkdir -p "$KEYDIR"
          PASS=$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)
          keytool -genkeypair -keystore "$KEYDIR/apps.jks" -alias apps -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=VideoEdit CI" >/dev/null 2>&1
          "$BT/apksigner" sign --ks "$KEYDIR/apps.jks" --ks-key-alias apps --ks-pass "pass:$PASS" \
            --out "$OUT/VideoEdit.apk" "$OUT/aligned.apk"
          "$BT/apksigner" verify "$OUT/VideoEdit.apk"
          echo "Built $OUT/VideoEdit.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoEdit-apk
          path: build/VideoEdit.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/VideoEdit.apk
          generate_release_notes: true
