name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK components
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE"
          SDK_ROOT="$ANDROID_SDK_ROOT"
          BT="$SDK_ROOT/build-tools/36.0.0"
          SDK_JAR="$SDK_ROOT/platforms/android-36/android.jar"
          OUT="$P/build"
          VCODE=$(grep '^versionCode=' app.properties | cut -d= -f2 || echo 1)
          VNAME=$(grep '^versionName=' app.properties | cut -d= -f2 || echo 1.0)
          MINSDK=$(grep '^minSdk=' app.properties | cut -d= -f2 || echo 24)
          rm -rf "$OUT"; mkdir -p "$OUT/gen" "$OUT/classes" "$OUT/dex"

          EXTRA_JARS=()
          if [ -f "$P/libs/tflite-classes.jar" ]; then EXTRA_JARS+=("$P/libs/tflite-classes.jar"); fi
          CP="$SDK_JAR"
          for j in "${EXTRA_JARS[@]+"${EXTRA_JARS[@]}"}"; do CP="$CP:$j"; done

          echo "1/5 Resources"
          RES=()
          if [ -d "$P/res" ] && [ -n "$(ls -A "$P/res")" ]; then
            "$BT/aapt2" compile --dir "$P/res" -o "$OUT/res.zip"
            RES=("$OUT/res.zip")
          fi
          ASSETS=()
          [ -d "$P/assets" ] && ASSETS=(-A "$P/assets")
          "$BT/aapt2" link -I "$SDK_JAR" --manifest "$P/AndroidManifest.xml" \
            --min-sdk-version "$MINSDK" --target-sdk-version 36 \
            --version-code "$VCODE" --version-name "$VNAME" \
            ${ASSETS[@]+"${ASSETS[@]}"} --java "$OUT/gen" -o "$OUT/base.apk" ${RES[@]+"${RES[@]}"}

          echo "2/5 Java"
          javac --release 8 -classpath "$CP" -Xlint:-options -encoding UTF-8 -nowarn \
            -d "$OUT/classes" $(find "$P/java" "$OUT/gen" -name '*.java')

          echo "3/5 Dex"
          D8_INPUTS=($(find "$OUT/classes" -name '*.class'))
          for j in "${EXTRA_JARS[@]+"${EXTRA_JARS[@]}"}"; do D8_INPUTS+=("$j"); done
          "$BT/d8" --release --min-api "$MINSDK" --lib "$SDK_JAR" --output "$OUT/dex" "${D8_INPUTS[@]}"

          echo "4/5 Package"
          python3 - "$OUT/base.apk" "$OUT/dex/classes.dex" "$OUT/aligned.apk" "$P/jniLibs" <<'PY'
          import sys, zipfile, os
          src, dex, dst, jni = sys.argv[1:]
          with zipfile.ZipFile(src) as zin, zipfile.ZipFile(dst, "w") as zout:
              entries = [(i, zin.read(i.filename)) for i in zin.infolist()]
              entries.append((zipfile.ZipInfo("classes.dex"), open(dex, "rb").read()))
              entries[-1][0].compress_type = zipfile.ZIP_DEFLATED
              for info, data in entries:
                  out = zipfile.ZipInfo(info.filename, date_time=info.date_time)
                  out.compress_type = info.compress_type
                  out.external_attr = info.external_attr
                  if out.compress_type == zipfile.ZIP_STORED:
                      start = zout.fp.tell() + 30 + len(out.filename.encode())
                      out.extra = b"\0" * ((-start) % 4)
                  zout.writestr(out, data)
              if os.path.isdir(jni):
                  for root,_,files in os.walk(jni):
                      for f in files:
                          fp = os.path.join(root,f)
                          rel = os.path.relpath(fp, jni).replace(os.sep,'/')
                          name = 'lib/' + rel
                          zi = zipfile.ZipInfo(name)
                          zi.compress_type = zipfile.ZIP_STORED
                          with open(fp,'rb') as fh: data = fh.read()
                          start = zout.fp.tell() + 30 + len(name.encode())
                          zi.extra = b"\0" * ((-start) % 4)
                          zout.writestr(zi, data)
          PY

          echo "5/5 Sign"
          KEYSTORE="$P/keys/release.jks"
          if [ ! -f "$KEYSTORE" ]; then
            echo "Missing keystore at $KEYSTORE" >&2; exit 1
          fi
          "$BT/apksigner" sign --ks "$KEYSTORE" --ks-key-alias videoedit --ks-pass pass:videoeditpass --key-pass pass:videoeditpass \
            --out "$OUT/VideoEdit.apk" "$OUT/aligned.apk"
          "$BT/apksigner" verify "$OUT/VideoEdit.apk"
          echo "Built $OUT/VideoEdit.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoEdit-apk
          path: build/VideoEdit.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/VideoEdit.apk
          generate_release_notes: true
